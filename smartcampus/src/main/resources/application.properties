spring.application.name=smartcampus
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/smartcampus}}
spring.mongodb.uri=${spring.data.mongodb.uri}
spring.data.mongodb.database=smartcampus

server.port=8080

app.security.frontend-origin=http://localhost:5173
app.security.oauth2-success-redirect=http://localhost:5173/oauth-success
app.security.bootstrap-admin-emails=

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
